<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="350" rx="16" fill="url(#bgGrad)"/>

  <!-- Dynamic Geometric Mesh & Glowing Nodes (Background Dynamic Elements) -->
  <g stroke="#6366f1" stroke-opacity="0.2" stroke-width="1">
    <line x1="100" y1="50" x2="300" y2="120"/>
    <line x1="300" y1="120" x2="200" y2="280"/>
    <line x1="200" y1="280" x2="50" y2="200"/>
    <line x1="50" y1="200" x2="100" y2="50"/>

    <line x1="1100" y1="60" x2="950" y2="160"/>
    <line x1="950" y1="160" x2="1050" y2="300"/>
    <line x1="1050" y1="300" x2="1150" y2="220"/>
    <line x1="1150" y1="220" x2="1100" y2="60"/>
  </g>

  <!-- Animated Pulse Circles (Dynamic Effect) -->
  <circle cx="300" cy="120" r="6" fill="#38bdf8" filter="url(#glow)">
    <animate attributeName="r" values="4;9;4" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="950" cy="160" r="7" fill="#c084fc" filter="url(#glow)">
    <animate attributeName="r" values="5;10;5" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="200" cy="280" r="5" fill="#818cf8" filter="url(#glow)">
    <animate attributeName="r" values="3;8;3" dur="3.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="1050" cy="300" r="6" fill="#38bdf8" filter="url(#glow)">
    <animate attributeName="r" values="4;8;4" dur="2.8s" repeatCount="indefinite" />
  </circle>

  <!-- Wave Chart Line (Mortgage Tech Graphic Background) -->
  <path d="M 0 260 Q 200 180 400 240 T 800 200 T 1200 230" fill="none" stroke="url(#textGrad)" stroke-width="3" opacity="0.3"/>
  
  <!-- Foreground Title and Subtitle -->
  <g text-anchor="middle">
    <!-- Icon / Symbol -->
    <text x="600" y="95" font-size="42" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">🏠 💳 📈</text>

    <!-- Main Title -->
    <text x="600" y="165" font-size="46" font-weight="900" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" letter-spacing="1.5">
      Awesome Mortgage Loan Origination System
    </text>

    <!-- Subtitle -->
    <text x="600" y="215" font-size="20" font-weight="500" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      Curated SaaS Platforms, Open-Source Repos, POS, Underwriting &amp; Lender Ecosystem
    </text>

    <!-- Tags Badge Bar -->
    <rect x="360" y="250" width="480" height="36" rx="18" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1"/>
    <text x="600" y="273" font-size="14" font-weight="600" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      Mortgage LOS • Digital POS • Underwriting • TRID &amp; HMDA Compliance
    </text>
  </g>
</svg>
